[project]
name = "scrapper"
version = "0.1.0"
description = "Multi-site web scraper for Reddit, Quora, Hotmart, Mercado Libre, Amazon, and Instagram"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
