[project]
name = "scrapper"
version = "0.3.0"
description = "Multi-site web scraper — Reddit, Hotmart (+ deprecated: Amazon, MercadoLibre, Quora)"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.1",
    "playwright-stealth>=2.0",
    "playwright>=1.45",
    "supabase>=2.7",
    "beautifulsoup4>=4.12",
    "tenacity>=8.3",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "curl-cffi>=0.7",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = [
    "src/scrapper/spiders/amazon.py",
    "src/scrapper/spiders/mercadolibre.py",
    "src/scrapper/spiders/quora.py",
]