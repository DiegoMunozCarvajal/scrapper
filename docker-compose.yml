services:
  scrapyd:
    build: .
    init: true
    ports:
      - "6800:6800"
      - "8080:8080"
    volumes:
      - scrapyd_data:/app/data
      - ./eggs:/app/eggs
      - ./dbs:/app/dbs
      - ./metrics:/app/metrics
      - ./logs:/app/logs
      - ./items:/app/items
      - ./queries.json:/app/queries.json
      - ./llm_cache.db:/app/llm_cache.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6800/daemonstatus.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scrapyd_data:
