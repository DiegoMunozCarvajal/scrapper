services:
  scrapyd:
    build: .
    init: true
    ports:
      - "6800:6800"
      - "8080:8080"
    volumes:
      - ./eggs:/app/eggs
      - ./dbs:/app/dbs
      - ./metrics:/app/metrics
      - ./logs:/app/logs
      - ./items:/app/items
      - ./rag_output:/app/rag_output
      - ./cookies:/app/cookies
      - ./queries.json:/app/queries.json
      - ./llm_cache.db:/app/llm_cache.db
    env_file:
      - .env
    restart: unless-stopped
    shm_size: 2gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
